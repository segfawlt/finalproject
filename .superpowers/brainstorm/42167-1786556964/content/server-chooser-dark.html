<style>
  .dark-preview { max-width: 860px; margin: 32px auto 0; color: #f5f5f5; }
  .dark-preview h1 { font-size: 42px; letter-spacing: -0.04em; margin-bottom: 10px; }
  .dark-preview .lede { color: #85858d; max-width: 560px; margin-bottom: 38px; }
  .dark-card { background: #0c0c0e; border: 1px solid #24242a; border-radius: 18px; padding: 10px; box-shadow: 0 18px 60px rgba(0,0,0,.3); }
  .dark-row { position:relative; display:flex; align-items:center; gap:14px; padding: 16px 18px; border-radius: 12px; cursor:pointer; overflow:hidden; }
  .dark-row::before { content:""; position:absolute; inset:0; border:1px solid transparent; border-radius:inherit; pointer-events:none; }
  .dark-row:hover { background:#151519; }
  .dark-row.selected::before { border-color:#7167ff; box-shadow: 0 0 22px rgba(113,103,255,.55), inset 0 0 16px rgba(113,103,255,.12); animation: glow 1.1s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity:.5; } to { opacity:1; box-shadow: 0 0 30px rgba(113,103,255,.8), inset 0 0 20px rgba(113,103,255,.18); } }
  .dark-mark { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:#f5f5f5; color:#0c0c0e; font-weight:700; }
  .dark-copy { flex:1; position:relative; }
  .dark-copy strong { display:block; font-size:16px; }
  .dark-copy span { color:#85858d; font-size:13px; }
  .dark-arrow { position:relative; color:#77777f; font-size:20px; }
  .dark-note { text-align:center; color:#66666f; font-size:12px; margin-top:18px; }
</style>
<div class="dark-preview">
  <h1>Choose a server</h1>
  <p class="lede">Select a Discord server to open its Studio workspace.</p>
  <div class="dark-card">
    <div class="dark-row selected" data-choice="server-a" onclick="toggleSelect(this)">
      <div class="dark-mark">N</div>
      <div class="dark-copy"><strong>Northstar Community</strong><span>12 channels · 846 members</span></div>
      <div class="dark-arrow">↗</div>
    </div>
    <div class="dark-row" data-choice="server-b" onclick="toggleSelect(this)">
      <div class="dark-mark">C</div>
      <div class="dark-copy"><strong>Creators Circle</strong><span>8 channels · 214 members</span></div>
      <div class="dark-arrow">↗</div>
    </div>
  </div>
  <p class="dark-note">Click a row to open Studio. The glow persists briefly while navigation loads.</p>
</div>

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_platform_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: discord_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d discord_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
